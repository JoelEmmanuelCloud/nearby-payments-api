# Minimal epoch lookup for the zkLogin nonce flow: just the current epoch id and
# its timestamps. Deliberately avoids the heavy `systemState { json }` and
# `validatorSet { contents { json } }` fields of `getLatestSuiSystemState`.
query getEpochId {
    epoch {
        epochId
        startTimestamp
        endTimestamp
    }
}

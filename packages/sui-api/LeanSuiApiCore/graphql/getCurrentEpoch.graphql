query getCurrentEpoch {
    epoch {
        epochId
        totalTransactions
        firstCheckpoint: checkpoints(first: 1) {
            nodes {
                sequenceNumber
            }
        }
        startTimestamp
        endTimestamp
        referenceGasPrice
        validatorSet {
            contents {
                json
            }
        }
    }
}

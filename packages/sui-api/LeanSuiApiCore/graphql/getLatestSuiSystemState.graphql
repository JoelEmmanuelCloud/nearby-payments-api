query getLatestSuiSystemState {
    epoch {
        epochId
        startTimestamp
        endTimestamp
        referenceGasPrice
        totalGasFees
        totalStakeRewards
        totalStakeSubsidies
        totalTransactions
        fundSize
        protocolConfigs {
            protocolVersion
        }
        systemState {
            json
        }
        validatorSet {
            contents {
                json
            }
        }
    }
}
